version: 2
updates:
  # El repo no tiene package.json, requirements.txt ni go.mod: lo único que
  # Dependabot puede vigilar aquí son las actions del workflow de CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "America/El_Salvador"
    open-pull-requests-limit: 5
    reviewers:
      - "kr0nicas"
    labels:
      - "dependencies"
      - "github-actions"
