version: 2
updates:
  # Las actions van fijadas por SHA con el tag en un comentario; Dependabot
  # actualiza los dos a la vez.
  #
  # commit-message explícito en ambos: el hook commit-msg y el job
  # commit-lint exigen <tipo>(<ámbito>) con un ámbito de scopes.txt, y dejar
  # que Dependabot lo deduzca del historial funciona hasta que deja de hacerlo.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "America/El_Salvador"
    open-pull-requests-limit: 5
    reviewers:
      - "kr0nicas"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"

  # web/ es el único package.json del repo. Sus dependencias no se vigilaban:
  # la auditoría encontró next con una vulnerabilidad crítica sin ningún aviso.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "America/El_Salvador"
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "kr0nicas"
    labels:
      - "dependencies"
      - "npm"
