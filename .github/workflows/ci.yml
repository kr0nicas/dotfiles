name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # shellcheck no soporta zsh; para los archivos zsh la comprobación es `zsh -n`.
      - name: Sintaxis zsh
        run: |
          zsh -n zshrc
          for f in config/zsh/*.zsh; do
            echo "  → $f"
            zsh -n "$f"
          done

      - name: Sintaxis bash
        run: |
          bash -n install.sh
          for f in lib/*.sh; do
            echo "  → $f"
            bash -n "$f"
          done
          bash -n scripts/github-topics-manager.sh
          bash -n config/bin/cn

      # -x hace que shellcheck siga los `source` de install.sh y analice lib/ como
      # un conjunto. Sin él, cada lib se ve aislada y las globales que install.sh
      # define parecen sin usar (SC2034 en cascada).
      - name: Shellcheck
        run: |
          shellcheck -x -S warning install.sh
          shellcheck -S warning scripts/*.sh config/bin/cn

      # La suite corre sin gcloud ni fzf instalados (usa stubs): es intencional,
      # para que valga igual en un runner limpio, en un contenedor y en un VPS.
      - name: Suite de tests
        run: zsh config/zsh/gcp.test.zsh
