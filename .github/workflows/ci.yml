name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # shellcheck no soporta zsh; para los archivos zsh la comprobación es `zsh -n`.
      - name: Sintaxis zsh
        run: |
          zsh -n zshrc
          for f in config/zsh/*.zsh; do
            echo "  → $f"
            zsh -n "$f"
          done

      - name: Sintaxis bash
        run: |
          bash -n install.sh
          for f in lib/*.sh; do
            echo "  → $f"
            bash -n "$f"
          done
          bash -n scripts/github-topics-manager.sh
          bash -n scripts/changelog.sh
          bash -n config/bin/cn
          # La capa que hace cumplir todo el arnés: si esto no se analiza,
          # CI no comprueba justo lo que valida a CI.
          for f in .githooks/commit-msg .githooks/pre-commit .githooks/pre-push \
                   .githooks/lib.sh .githooks/hooks.test.sh; do
            echo "  → $f"
            bash -n "$f"
          done

      # -x hace que shellcheck siga los `source` de install.sh y analice lib/ como
      # un conjunto. Sin él, cada lib se ve aislada y las globales que install.sh
      # define parecen sin usar (SC2034 en cascada).
      - name: Shellcheck
        run: |
          shellcheck -x -S warning install.sh
          shellcheck -S warning scripts/*.sh config/bin/cn \
            .githooks/commit-msg .githooks/pre-commit .githooks/pre-push \
            .githooks/lib.sh .githooks/hooks.test.sh
          # -x también aquí: sourcea lib/packages.sh para probar una de sus
          # funciones, y sin seguir ese source shellcheck no la ve definida.
          shellcheck -x -S warning lib/packages.test.sh

      # Las suites corren sin gcloud, sin fzf y sin shellcheck (usan stubs y
      # degradación): es intencional, para que valgan igual en un runner
      # limpio, en un contenedor y en un VPS.
      - name: Suite de tests
        run: |
          zsh config/zsh/gcp.test.zsh
          zsh config/zsh/ssh.test.zsh
          bash .githooks/hooks.test.sh
          bash lib/packages.test.sh

  commit-lint:
    name: Mensajes de commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Por defecto actions/checkout deja el merge commit sintético del PR
          # («Merge <sha> into <sha>»), que entra en el rango y no es ninguna
          # de las formas que genera git, así que el hook lo rechaza y el job
          # se suspende a sí mismo. Checkear la rama por nombre lo saca del
          # rango, que es mejor que ensanchar la exención de «Merge *».
          ref: ${{ github.head_ref }}

      # Misma lógica que en local: se reutiliza el hook, no una copia.
      # LC_ALL fijo porque «${#subject}» cuenta caracteres o bytes según el
      # locale (medido: 68 vs 73 para la misma cadena con acentos); sin
      # esto el límite de 72 significa cosas distintas en local y en CI.
      - name: Validar mensajes del PR
        env:
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          # Sin --depth: el checkout ya trae todo con fetch-depth 0, y
          # «--depth=0» aborta con «depth 0 is not a positive number».
          git fetch origin "${{ github.base_ref }}"
          # Se captura ANTES del for. Un fallo de git rev-list dentro de la
          # sustitución de comandos no dispara errexit, así que el for
          # iteraría en vacío y el job pasaría en verde sin validar nada.
          shas="$(git rev-list "$base..HEAD")"
          rc=0
          for sha in $shas; do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            if ! bash .githooks/commit-msg /tmp/msg.txt; then
              echo "  ↑ en $sha"
              rc=1
            fi
          done
          exit $rc

  # El resto de jobs solo mira el código sin ejecutarlo: bash -n, shellcheck y
  # tests unitarios con stubs. Nada de eso ejecuta install.sh, así que un fallo
  # de integración pasa en verde — ocurrió con gh_latest_url, que descargaba el
  # asset equivocado en silencio y superó las tres comprobaciones y los 114
  # tests. Este job cierra ese hueco: instala de verdad y comprueba el
  # resultado.
  install-smoke:
    name: Instalación real (Debian mínimo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # debian:stable-slim y no el runner de ubuntu: el runner ya trae curl,
      # git, unzip y medio SDK, así que da por buenas dependencias que en un VPS
      # recién creado no existen. La imagen slim es la que se parece al destino
      # real de los presets --vps y --container.
      #
      # El repo se copia dentro del contenedor en vez de montarse: phase_repo
      # escribe core.hooksPath en el .git, y montar dejaría esa escritura en el
      # checkout del runner.
      #
      # --vps y no --container: cubre lo mismo más el bloque cloud, que incluye
      # tflint y con él gh_latest_zip, el camino más nuevo y menos probado.
      - name: Instalar preset --vps en debian:stable-slim
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/src:ro" debian:stable-slim \
            bash -euo pipefail -c '
              # Prerrequisitos que install.sh exige (curl, git, zsh), más sudo
              # —lo usa phase_packages— y ca-certificates, que la imagen slim no
              # trae y sin el cual falla todo HTTPS.
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                curl git zsh sudo ca-certificates >/dev/null

              cp -a /src /dotfiles
              git config --global --add safe.directory /dotfiles
              cd /dotfiles
              ./install.sh --vps

              # install.sh instala en ~/.local/bin, que no está en el PATH de
              # este shell no interactivo. zshrc lo antepone; aquí hay que
              # hacerlo a mano o todo saldría como no encontrado.
              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              echo ""
              echo "── Verificación: ¿existe y es ejecutable? ──"
              fail=0
              # trip y no trippy: el proyecto se llama trippy pero su ejecutable
              # es `trip`. mtr llega por el paquete mtr-tiny, con el mismo
              # binario que el paquete completo pero sin arrastrar GTK.
              for t in zsh tmux git curl jq rg fd direnv btop zstd unzip \
                       fzf starship zoxide uv fnm \
                       lazygit delta trivy sops dust curlie jless \
                       ruff shellcheck yamllint \
                       mtr nmap socat iperf3 tshark \
                       trip step bandwhich termshark oha doggo lnav sshuttle \
                       tflint tofu \
                       nvim; do
                p=$(command -v "$t" 2>/dev/null || true)
                if [ -n "$p" ] && [ -x "$p" ]; then
                  printf "  ✅ %-12s %s\n" "$t" "$p"
                else
                  printf "  ❌ %-12s NO ENCONTRADO\n" "$t"
                  fail=1
                fi
              done

              # node llega por fnm y solo entra al PATH tras evaluar su env, así
              # que se comprueba aparte y no en el bucle de arriba.
              eval "$(fnm env --shell bash)" 2>/dev/null || true
              if node --version >/dev/null 2>&1; then
                printf "  ✅ %-12s %s\n" "node" "$(node --version)"
              else
                printf "  ❌ %-12s NO ENCONTRADO\n" "node"
                fail=1
              fi

              # Los symlinks son la otra mitad de la instalación: sin esto, un
              # phase_symlinks roto pasaría inadvertido.
              echo ""
              echo "── Verificación: symlinks ──"
              for l in "$HOME/.zshrc" "$HOME/.tmux.conf" "$HOME/.gitconfig" \
                       "$HOME/.config/nvim" "$HOME/.claude/CLAUDE.md"; do
                if [ -L "$l" ] && [ -e "$l" ]; then
                  printf "  ✅ %s → %s\n" "$l" "$(readlink "$l")"
                else
                  printf "  ❌ %s no es un symlink válido\n" "$l"
                  fail=1
                fi
              done

              # El zshrc instalado tiene que parsear con el zsh de la imagen.
              # En if/else y no con && : bajo set -e un && cuyo primer comando
              # falla no aborta ni deja marcado el fallo, así que un zshrc roto
              # se colaría en verde.
              echo ""
              if zsh -n "$HOME/.zshrc"; then
                printf "  ✅ zsh -n ~/.zshrc\n"
              else
                printf "  ❌ zsh -n ~/.zshrc falló\n"
                fail=1
              fi

              exit $fail
            '

  changelog-drift:
    name: CHANGELOG al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # ref es obligatorio, no cosmético: por defecto actions/checkout deja
          # el repo en detached HEAD, «git rev-parse --abbrev-ref HEAD» devuelve
          # literalmente «HEAD», y changelog.sh omite la sección de la rama en
          # curso. El check fallaría en TODO PR real por mucho que el autor
          # regenerara. Verificado reproduciendo el detached HEAD en un clon.
          ref: ${{ github.head_ref }}

      - name: Comprobar que CHANGELOG.md está regenerado
        run: ./scripts/changelog.sh --check
