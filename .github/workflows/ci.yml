name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      # shellcheck no soporta zsh; para los archivos zsh la comprobación es `zsh -n`.
      - name: Sintaxis zsh
        run: |
          zsh -n zshrc
          for f in config/zsh/*.zsh; do
            echo "  → $f"
            zsh -n "$f"
          done

      - name: Sintaxis bash
        run: |
          bash -n install.sh
          for f in lib/*.sh; do
            echo "  → $f"
            bash -n "$f"
          done
          bash -n scripts/github-topics-manager.sh
          bash -n config/bin/cn

      # -x hace que shellcheck siga los `source` de install.sh y analice lib/ como
      # un conjunto. Sin él, cada lib se ve aislada y las globales que install.sh
      # define parecen sin usar (SC2034 en cascada).
      - name: Shellcheck
        run: |
          shellcheck -x -S warning install.sh
          shellcheck -S warning scripts/*.sh config/bin/cn

      # Las suites corren sin gcloud, sin fzf y sin shellcheck (usan stubs y
      # degradación): es intencional, para que valgan igual en un runner
      # limpio, en un contenedor y en un VPS.
      - name: Suite de tests
        run: |
          zsh config/zsh/gcp.test.zsh
          bash .githooks/hooks.test.sh

  commit-lint:
    name: Mensajes de commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Misma lógica que en local: se reutiliza el hook, no una copia.
      - name: Validar mensajes del PR
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          # Sin --depth: el checkout ya trae todo con fetch-depth 0, y
          # «--depth=0» aborta con «depth 0 is not a positive number».
          git fetch origin "${{ github.base_ref }}"
          # Se captura ANTES del for. Un fallo de git rev-list dentro de la
          # sustitución de comandos no dispara errexit, así que el for
          # iteraría en vacío y el job pasaría en verde sin validar nada.
          shas="$(git rev-list "$base..HEAD")"
          rc=0
          for sha in $shas; do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            if ! bash .githooks/commit-msg /tmp/msg.txt; then
              echo "  ↑ en $sha"
              rc=1
            fi
          done
          exit $rc

  changelog-drift:
    name: CHANGELOG al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # ref es obligatorio, no cosmético: por defecto actions/checkout deja
          # el repo en detached HEAD, «git rev-parse --abbrev-ref HEAD» devuelve
          # literalmente «HEAD», y changelog.sh omite la sección de la rama en
          # curso. El check fallaría en TODO PR real por mucho que el autor
          # regenerara. Verificado reproduciendo el detached HEAD en un clon.
          ref: ${{ github.head_ref }}

      - name: Comprobar que CHANGELOG.md está regenerado
        run: ./scripts/changelog.sh --check
