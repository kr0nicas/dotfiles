# Indicamos la paleta de alto contraste
palette = "p10k_style"

# Estructura de segmentos con flechas (el look p10k)
format = """
[](status_bg)\
$os\
$directory\
[](fg:status_bg bg:python_bg)\
$python\
[](fg:python_bg bg:git_bg)\
$git_branch\
$git_status\
[](fg:git_bg)\
$character"""

[os]
disabled = false
style = "bg:status_bg fg:white"
format = "[$symbol]($style)"

[directory]
style = "bg:status_bg fg:white"
format = "[ $path ]($style)"
truncation_length = 3
fish_style_pwd_dir_length = 1

[python]
symbol = "🐍 "
style = "bg:python_bg fg:black"
format = '[ $symbol($version) ]($style)'

[git_branch]
symbol = " "
style = "bg:git_bg fg:white"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:git_bg fg:white"
format = '([\[$all_status$ahead_behind\]]($style))'

[character]
success_symbol = "[ ❯](bold green)"
error_symbol = "[ ❯](bold red)"

# --- PALETA DE COLORES P10K (Azul SRE / Amarillo Python / Gris Git) ---
[palettes.p10k_style]
status_bg = '#005fdf'    # Azul vibrante (SRE/Linux)
python_bg = '#ffd700'    # Amarillo oro (Python)
git_bg = '#444444'       # Gris carbón (Git)

[username]
style_user = "white bold"
style_root = "black bold"
format = "[$user]($style) "
disabled = false
show_always = true
