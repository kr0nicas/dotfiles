# ==============================================================================
# TMUX CONFIG SRE 2026 - Jorge Ochoa (kr0nicas)
# ==============================================================================
# Requisito: TPM (Tmux Plugin Manager)
# Instalar: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Activar plugins: Prefix + I (mayúscula)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. TERMINAL Y COLOR VERDADERO
# ------------------------------------------------------------------------------
set -g  default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # True color en iTerm2/Alacritty/Kitty
set -ag terminal-overrides ",alacritty:RGB"
set -g  focus-events on                            # Necesario para vim/nvim autoread

# ------------------------------------------------------------------------------
# 2. AJUSTES GENERALES
# ------------------------------------------------------------------------------
set -g  mouse on
set -g  history-limit 100000                       # Subido: logs largos en prod
set -g  base-index 1
setw -g pane-base-index 1
set -s  escape-time 0
set -g  renumber-windows on                        # Renumera al cerrar ventanas
set -g  set-clipboard on
set -g  display-time 2000                          # Mensajes visibles 2s
set -g  status-interval 5                          # Refresco de status cada 5s

# ------------------------------------------------------------------------------
# 3. PREFIX
# ------------------------------------------------------------------------------
unbind C-b
set -g  prefix C-a
bind    C-a send-prefix

# ------------------------------------------------------------------------------
# 4. ATAJOS DE TECLADO
# ------------------------------------------------------------------------------

# Recargar config
bind r source-file ~/.tmux.conf \; display "  Config recargada"

# Splits intuitivos manteniendo el path actual
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"   # Nueva ventana con mismo path

# Navegación entre paneles estilo Vim (sin prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Navegación entre ventanas con Alt+número
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Resize de paneles con Prefix + HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap de ventanas
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Matar pane/ventana sin confirmación molesta
bind x kill-pane
bind X kill-window

# Layout rápido SRE: 3 paneles (main arriba, 2 abajo)
bind S select-layout main-horizontal \; split-window -h -c "#{pane_current_path}"

# ------------------------------------------------------------------------------
# 5. MODO COPIA ESTILO VI
# ------------------------------------------------------------------------------
setw -g mode-keys vi

bind Enter copy-mode                               # Entra en copy-mode con Enter
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "$TMUX_COPY_CMD"
bind -T copy-mode-vi H   send -X start-of-line
bind -T copy-mode-vi L   send -X end-of-line

# Detecta pbcopy (Mac) vs xclip/xsel (Linux)
if-shell "uname | grep -q Darwin" \
    "set-environment -g TMUX_COPY_CMD 'pbcopy'" \
    "set-environment -g TMUX_COPY_CMD 'xclip -selection clipboard 2>/dev/null || xsel --clipboard --input'"

# ------------------------------------------------------------------------------
# 6. ESTÉTICA — Catppuccin Mocha (mismo que starship.toml)
# ------------------------------------------------------------------------------
# Fondo transparente para que use el color del terminal
set -g status-style "bg=#1e1e2e fg=#cdd6f4"

# Bordes de paneles
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Mensajes (display-message)
set -g message-style       "bg=#313244 fg=#f9e2af bold"
set -g message-command-style "bg=#313244 fg=#a6e3a1"

# Modo copia
setw -g mode-style "bg=#45475a fg=#cdd6f4"

# ------------------------------------------------------------------------------
# 7. STATUS BAR
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify  left
set -g status-left-length  60
set -g status-right-length 120

# LEFT: sesión + hostname
set -g status-left "\
#[bg=#89b4fa,fg=#1e1e2e,bold]  #S \
#[bg=#313244,fg=#89b4fa,nobold]\
#[bg=#313244,fg=#6c7086] #{?client_prefix,#[fg=#f9e2af bold] C-a ,  }\
#[bg=#1e1e2e,fg=#313244]  "

# VENTANA inactiva
setw -g window-status-style         "bg=#1e1e2e fg=#6c7086"
setw -g window-status-format        "  #I #W  "
setw -g window-status-separator     ""

# VENTANA activa
setw -g window-status-current-style  "bg=#313244 fg=#cdd6f4 bold"
setw -g window-status-current-format "\
#[bg=#313244,fg=#1e1e2e]\
#[bg=#313244,fg=#89b4fa bold]  #I #W \
#[bg=#1e1e2e,fg=#313244]"

# RIGHT: usuario@host | hora | fecha
set -g status-right "\
#[bg=#1e1e2e,fg=#313244]\
#[bg=#313244,fg=#94e2d5]  #{pane_current_command} \
#[bg=#313244,fg=#45475a]\
#[bg=#45475a,fg=#cba6f7]  #(whoami)@#h \
#[bg=#45475a,fg=#6c7086]\
#[bg=#6c7086,fg=#1e1e2e]  %H:%M   %d %b "

# ------------------------------------------------------------------------------
# 8. PLUGINS (TPM)
# ------------------------------------------------------------------------------
# Instalar TPM primero:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'       # Defaults sensatos
set -g @plugin 'tmux-plugins/tmux-resurrect'      # Guarda/restaura sesiones
set -g @plugin 'tmux-plugins/tmux-continuum'      # Auto-save cada 15min
set -g @plugin 'tmux-plugins/tmux-yank'           # Copy multiplataforma mejorado

# Configuración de plugins
set -g @resurrect-capture-pane-contents 'on'      # Guarda contenido de paneles
set -g @continuum-restore 'on'                     # Restaura al iniciar tmux
set -g @continuum-save-interval '15'

# Inicializar TPM (siempre al final del archivo)
run '~/.tmux/plugins/tpm/tpm'
